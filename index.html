<script>
/* 공개용 설정: Project URL과 publishable(anon) 키만 넣는다. secret/service_role 키와 DB 비밀번호는 절대 넣지 않는다. */
window.APP_CONFIG = { url: 'https://zqfvntplsqftbkfewqsk.supabase.co', key: 'sb_publishable_bXeTU9omjAxUzUijyNzEkg_JmrTo-8v' };

<script>
/* ---- dates.js ---- */
// 날짜는 모두 'YYYY-MM-DD' 문자열로 다루고, 내부 계산은 UTC로 해서 시간대 문제를 피한다.
const pad = (n) => String(n).padStart(2, '0');

function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function ymd(d) {
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}
function addDays(s, n) {
  const d = parseYMD(s);
  d.setUTCDate(d.getUTCDate() + n);
  return ymd(d);
}
// 말일 보정: 1/31 + 1개월 = 2/28(29)
function addMonths(s, n) {
  const d = parseYMD(s);
  const day = d.getUTCDate();
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return ymd(t);
}
function diffDays(a, b) {
  return Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
}
function dayOfWeek(s) {
  return parseYMD(s).getUTCDay(); // 0=일 ... 6=토
}
// b 시점에 a로부터 꽉 채운 연수
function fullYearsBetween(a, b) {
  const x = parseYMD(a), y = parseYMD(b);
  let years = y.getUTCFullYear() - x.getUTCFullYear();
  const before =
    y.getUTCMonth() < x.getUTCMonth() ||
    (y.getUTCMonth() === x.getUTCMonth() && y.getUTCDate() < x.getUTCDate());
  if (before) years -= 1;
  return years;
}
function daysInMonth(year, month) {
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

/* ---- attendance.js ---- */

// 관리자 설정값(policies 테이블)과 1:1로 대응한다.
const DEFAULT_POLICY = {
  breakMinutes: 60,          // 하루 고정 휴게 공제 (체류시간과 무관)
  leaveHoursPerDay: 8,       // 연차 1일 = 8시간으로 환산 (반차는 절반)
  weeklyHolidayDow: [0],     // 휴일근로로 분리 집계할 요일 (0=일요일)
};

function toMinutes(hm) {
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}

// 하루 실근로(분) = 체류시간 - 고정 휴게. 퇴근이 출근보다 이르면 익일 퇴근으로 본다.
function dailyWorkMinutes(record, policy = DEFAULT_POLICY) {
  if (!record || !record.clockIn || !record.clockOut) return 0;
  let stay = toMinutes(record.clockOut) - toMinutes(record.clockIn);
  if (stay < 0) stay += 24 * 60;
  return Math.max(0, stay - policy.breakMinutes);
}

function fmtMinutes(min) {
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

/**
 * 월 근태 집계
 * @param records  [{date, clockIn:'09:00', clockOut:'18:00'}]
 * @param leaves   승인된 휴가를 일 단위로 펼친 것 [{date, minutes}] — minutes는 휴가 유형의 '유급 인정 시간'.
 *                 minutes가 없으면 {date, days}를 days × leaveHoursPerDay로 환산(하위 호환).
 * @param holidays 공휴일 ['YYYY-MM-DD']
 * 규칙: 휴가는 근무일에만 환산, 휴일(일요일·공휴일) 근무는 평일 합계와 분리 집계.
 */
function summarizeMonth({ year, month, records, leaves = [], holidays = [], policy = DEFAULT_POLICY }) {
  const recByDate = new Map(records.map((r) => [r.date, r]));
  const leaveByDate = new Map(); // date → 인정 분
  for (const l of leaves) {
    const minutes = l.minutes ?? (l.days ?? 0) * policy.leaveHoursPerDay * 60;
    leaveByDate.set(l.date, (leaveByDate.get(l.date) ?? 0) + minutes);
  }
  const holidaySet = new Set(holidays);

  let workMinutes = 0, leaveMinutes = 0, holidayWorkMinutes = 0, workDays = 0;
  const details = [];

  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isHoliday = policy.weeklyHolidayDow.includes(dayOfWeek(date)) || holidaySet.has(date);
    const work = dailyWorkMinutes(recByDate.get(date), policy);

    if (isHoliday) {
      holidayWorkMinutes += work;
      if (work > 0) details.push({ date, kind: 'holiday', workMinutes: work, leaveMinutes: 0 });
      continue;
    }
    const leave = leaveByDate.get(date) ?? 0;
    workMinutes += work;
    leaveMinutes += leave;
    if (work > 0) workDays += 1;
    if (work > 0 || leave > 0) details.push({ date, kind: 'weekday', workMinutes: work, leaveMinutes: leave });
  }

  return {
    workMinutes,
    leaveMinutes,
    weekdayMinutes: workMinutes + leaveMinutes, // 평일 합계 = 실근로 + 휴가 환산
    holidayWorkMinutes,                          // 휴일근로는 별도
    workDays,
    details,
  };
}

/**
 * 월 소정근로시간(분) = (휴일이 아닌 날 수) × 하루 소정시간
 * 휴일 = weeklyHolidayDow(일요일) + 공휴일·대체공휴일. 토요일은 휴일로 보지 않지만
 * 이 회사처럼 주 5일제이면 weeklyHolidayDow에 6(토)을 포함해 설정한다.
 * @param dailyMinutes 하루 소정근로시간(분), 기본 8시간
 * @param offDow       소정근로일에서 제외할 요일 (기본: 토·일)
 */
function scheduledMinutes({ year, month, holidays = [], dailyMinutes = 480, offDow = [0, 6] }) {
  const holidaySet = new Set(holidays);
  let days = 0;
  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (offDow.includes(dayOfWeek(date)) || holidaySet.has(date)) continue;
    days += 1;
  }
  return { days, minutes: days * dailyMinutes };
}

class ApiError extends Error { constructor(status, body) { super((body && (body.message || body.msg || body.error_description)) || `HTTP ${status}`); this.status = status; this.body = body || {}; this.code = this.body.code; } }

      catch (e) { session = null; store.set(null); throw new ApiError(401, { message: 'session expired' }); }

/* ---------- 화면: 월 근무 / 출퇴근기록 / 휴가 / 요청 ---------- */

    return out.join('');

      lv.filter((l) => !seen.has(l.reqId) && seen.add(l.reqId)).map((l) => `<div class="it"><div class="ico">${ico('plane')}</div><div><b>${esc(typeOf(l.typeId)?.name ?? '휴가')}</b><div class="muted small">${statusKo[l.status] ?? ''}</div></div></div>`).join('') +
      (r ? `<div class="it"><div class="ico">${ico('clock')}</div><div><b>${r.clockIn} - ${r.clockOut || '근무 중'}</b><div class="muted small">${recordDone(r) ? `실근로 ${hours(dailyWorkMinutes(r, S.policy))}` : '퇴근 전'}</div></div></div>` : '');

function monthSummary(y, m) {

  }
  const hol = Object.keys(S.holidays);
  const s = summarizeMonth({ year: y, month: m, records, leaves, holidays: hol, policy: S.policy });

}

  const acts = [['edit', '수정'], ['create', '생성'], ['delete', '삭제']];
  return { header: header({ back: true, title: '출퇴근기록 정정 요청', right: `<button id="sendBtnA" class="btn" style="border:0;color:var(--primary);height:44px" data-a="sendAtt" ${attOk() && !S.busy ? '' : 'disabled'}>보내기</button>` }), cls: 'narrow', body: `<div class="bleed">
    <div class="seg" style="margin:12px">${acts.map(([k, l]) => `<button class="${d.action === k ? 'on' : ''}" data-a="attAction" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="field"><label for="ad">날짜</label><input id="ad" type="date" min="${addDays(S.today, -60)}" max="${S.today}" value="${d.date}" data-c="ad" data-f="date">
      <div class="muted small" style="margin-top:8px">현재 기록: ${cur ? `${cur.clockIn} - ${cur.clockOut ?? '근무 중'}` : '없음'}</div></div>
    ${d.action === 'delete' ? '' : `<div class="field"><div class="pair"><label class="small muted">출근 시각<input type="time" value="${d.clockIn}" data-c="ad" data-f="clockIn"></label><label class="small muted">퇴근 시각<input type="time" value="${d.clockOut}" data-c="ad" data-f="clockOut"></label></div></div>`}
    ${err ? `<div class="foot" style="color:var(--red)" role="alert">${esc(err)}</div>` : `<div class="foot" role="status">실근로: ${before == null ? '-' : hours(before)} → ${after == null ? '-' : hours(after)} (휴게 ${S.policy.breakMinutes}분 공제)</div>`}
    <div class="field"><label for="areason">사유 (필수)</label><textarea id="areason" data-i="areason" placeholder="예: 퇴근 기록을 깜빡했습니다">${esc(d.reason)}</textarea></div>
    <button class="pick ${ap ? '' : 'need'}" style="margin-top:10px" data-a="sheet" data-k="approverA"><b>승인권자 <span class="chip live">${ap ? 1 : 0} / 1</span></b><span class="v">${ap ? esc(ap.name) : '선택해 주세요'} ›</span></button>
    ${ap ? `<div class="muted small" style="padding:6px 16px">${esc(approverTitle(ap.id))}</div>` : ''}</div>` };
}

const TABS = { home: homeScreen, schedule: scheduleScreen, records: recordsScreen, leave: leaveScreen, requests: requestsScreen };
const PAGES = { leave1: leaveStep1, leave2: leaveStep2, att: attForm, req: requestDetail };

/* ---------- 시트 ---------- */
function geoMessage(res) {
  const g = res || {};
  if (g.code === 'too_far') return `${g.site_name}에서 ${g.distance}m 떨어져 있습니다. ${g.radius}m 이내에서만 가능합니다.`;
  if (g.code === 'low_accuracy') return `위치 정확도가 낮습니다 (오차 ${g.accuracy}m). 실외나 창가에서 다시 시도해 주세요.`;
  if (g.code === 'no_site') return '등록된 근무지가 없습니다. 관리자에게 문의해 주세요.';
  if (g.code === 'denied') return '위치 권한이 거부되어 있습니다. 브라우저 설정에서 이 사이트의 위치를 허용해 주세요.';
  if (g.code === 'unavailable') return '현재 위치를 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if (g.code === 'unsupported') return '이 기기에서는 위치 확인을 지원하지 않습니다.';
  return '위치를 확인할 수 없습니다.';
}
function renderSheet() {
  const sh = S.sheet;
  if (!sh) return '';
  const wrap = (inner) => `<div class="sheetbg" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">${inner}</div></div>`;
  if (sh.k === 'request') {
    const items = [['출퇴근기록 생성', 'attNew', 'create'], ['출퇴근기록 수정', 'attNew', 'edit'], ['출퇴근기록 삭제', 'attNew', 'delete'], ['휴가 생성', 'leaveNew', '']];
    return wrap(`<div class="sh">요청 종류를 선택하세요.</div>${items.map(([l, a, k]) => `<button class="si" data-a="${a}" data-k="${k}">${l}</button>`).join('')}<button class="si" data-a="closeSheet">취소</button>`);
  }
  if (sh.k === 'type') {
    const d = S.draft;
    return wrap(S.groups.map((g, gi) => { const ts = S.types.filter((t) => t.group_id === g.id); return ts.length ? `<div class="grp">${gi + 1}. ${esc(g.name)}</div>${ts.map((t) => `<button class="si ${t.id === d.typeId ? 'on' : ''}" data-a="setType" data-id="${t.id}"><span>${esc(typeLabel(t))}</span><span>${t.id === d.typeId ? '✓' : ''}</span></button>`).join('')}` : ''; }).join(''));
  }
  if (sh.k === 'approver' || sh.k === 'approverA') {
    const a = sh.k === 'approver' ? S.draft : S.adraft, list = a.approvers;
    return wrap(`<div class="sh">승인권자를 선택하세요.</div>${!list ? spinner : list.map((c) => `<button class="si ${a.approverId === c.approver_id ? 'on' : ''}" data-a="setApprover" data-w="${sh.k}" data-id="${c.approver_id}"><span>${esc(c.name)}<div class="muted small">${esc(c.head_title ? `${c.head_title} · ${c.org_name}` : '')}</div></span><span>${a.approverId === c.approver_id ? '✓' : ''}</span></button>`).join('') || '<div class="empty">후보가 없습니다. 관리자에게 문의해 주세요.</div>'}`);
  }
  if (sh.k === 'geoFail') {
    return wrap(`<div class="sh" style="color:var(--red);font-weight:700">${sh.action === 'in' ? '출근' : '퇴근'}할 수 없습니다</div><div style="padding:0 20px 12px">${esc(geoMessage(sh.res))}</div>
      <button class="si" data-a="clock">다시 시도</button><button class="si" data-a="attFromGeo" data-k="${sh.action}">출퇴근 누락·수정 요청 보내기</button><button class="si" data-a="closeSheet">닫기</button>`);
  }
  if (sh.k === 'drawer') {
    return `<div class="sheetbg" style="justify-content:flex-start;align-items:stretch" data-a="closeSheet"><div class="drawer" role="dialog" aria-modal="true" data-stop="1">
      <div style="padding:0 20px 14px"><b style="font-size:18px">${esc(S.me.name)}</b><div class="muted small">${esc(orgOf(S.me.org_id)?.name ?? '소속 없음')}${S.me.role === 'admin' ? ' · 관리자' : ''}</div></div>
      <button class="si" data-a="reload">새로고침</button><button class="si" data-a="logout">로그아웃</button><button class="si" data-a="closeSheet">닫기</button></div></div>`;
  }
  return '';
}

/* ---------- 로그인 화면 ---------- */
function authScreen() {
  if (S.view === 'boot') return `<div class="login"><div class="empty">${spinner}</div></div>`;
  if (S.view === 'noprofile') return `<div class="login"><h1>직원 등록이 필요합니다</h1><div class="card"><p>로그인은 되었지만 직원 정보가 등록되어 있지 않습니다. 관리자에게 이 계정을 직원으로 등록해 달라고 요청해 주세요.</p><div class="muted small">계정: ${esc(session && session.user ? session.user.email : '')}</div><div class="btns"><button class="btn block" data-a="logout">다른 계정으로 로그인</button></div></div></div>`;
  return `<div class="login"><h1>근태·휴가</h1><div class="muted">회사에서 안내받은 계정으로 로그인하세요.</div>
    <div class="card" style="margin-top:20px"><label for="em" style="margin-top:0">이메일</label><input id="em" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(S.lastEmail || '')}">
      <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
      ${S.authError ? `<div class="err" role="alert">${esc(S.authError)}</div>` : ''}
      <div class="btns"><button class="btn primary" data-a="login" ${S.busy ? 'disabled' : ''}>${S.busy ? '로그인 중…' : '로그인'}</button></div></div></div>`;
}

/* ---------- 렌더 ---------- */
function render() {
  if (!['main'].includes(S.view)) { $('app').innerHTML = authScreen(); $('sheet').innerHTML = ''; $('toast').innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''; return; }
  const top = S.stack[S.stack.length - 1];
  const scr = top ? PAGES[top.name](top) : TABS[S.tab]();
  const err = S.loadError ? `<div class="card" style="color:var(--red)" role="alert">${esc(S.loadError)} <button class="btn" data-a="reload" style="height:36px">다시 시도</button></div>` : '';
  $('app').innerHTML = `<div class="app"><div class="shell">${sidebar()}<div class="content">${scr.header}<main class="main ${scr.cls || ''}">${err}${scr.body}</main></div></div>${tabbar()}</div>`;
  $('sheet').innerHTML = renderSheet();
  $('toast').innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '';
}
let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 3200); }
const push = (name, extra = {}) => { S.stack.push({ name, ...extra }); S.sheet = null; render(); window.scrollTo && window.scrollTo(0, 0); };
const closeSheet = () => { S.sheet = null; render(); };
async function guard(fn) {
  try { return await fn(); }
  catch (e) {
    if (e instanceof ApiError && e.status === 401) { await doLogout(true); return undefined; }
    if (e instanceof TypeError) e.status = 0;
    S.busy = false; toast(errText(e)); return undefined;
  }
}
const getPos = () => new Promise((resolve) => {
  if (typeof navigator === 'undefined' || !navigator.geolocation) return resolve({ error: 'unsupported' });
  navigator.geolocation.getCurrentPosition((q) => resolve({ lat: q.coords.latitude, lng: q.coords.longitude, accuracy: q.coords.accuracy }),
    (e) => resolve({ error: e.code === 1 ? 'denied' : 'unavailable' }), { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
});

/* ---------- 로그인 / 로그아웃 / 시작 ---------- */
async function bootMain() {
  S.view = 'boot'; render();
  try {
    S.today = seoulToday();
    const ok = await loadStatic();
    if (!ok) { S.view = 'noprofile'; render(); return; }
    S.view = 'main'; S.loadError = ''; render();
    await Promise.all([loadHomeData(), loadRequests(), loadLeave()]);
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) { await doLogout(true); return; }
    S.view = S.me ? 'main' : 'login';
    if (S.view === 'main') S.loadError = `일부 데이터를 불러오지 못했습니다. ${errText(e)}`; else S.authError = `데이터를 불러오지 못했습니다. ${errText(e)}`;
  }
  render();
}
async function doLogout(expired) {
  try { if (session && !expired) await fetch(CFG.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: CFG.key, Authorization: `Bearer ${session.access_token}` } }); } catch (e) { /* 무시 */ }
  session = null; store.set(null);
  Object.assign(S, { me: null, view: 'login', stack: [], sheet: null, tab: 'home', recs: {}, lv: {}, bal: null, myLeave: [], myAtt: [], inboxLeave: [], inboxAtt: [], loaded: new Set(), draft: null, adraft: null, authError: expired ? '로그인 시간이 지났습니다. 다시 로그인해 주세요.' : '' });
  render();
}

/* ---------- 동작 ---------- */
const A = {
  login: async () => {
    const em = $('em').value.trim(), pw = $('pw').value; S.lastEmail = em;
    if (!em || !pw) { S.authError = '이메일과 비밀번호를 입력해 주세요.'; render(); return; }
    S.busy = true; S.authError = ''; render();
    try { saveSession(await authCall('/auth/v1/token?grant_type=password', { email: em, password: pw })); S.busy = false; await bootMain(); }
    catch (e) {
      S.busy = false;
      S.authError = e instanceof ApiError ? (e.status === 400 || e.status === 401 || e.status === 422 ? '이메일 또는 비밀번호가 맞지 않습니다.' : errText(e)) : '네트워크에 연결할 수 없습니다.';
      render();
    }
  },
  logout: () => doLogout(false),
  reload: () => guard(async () => { S.sheet = null; S.loadError = ''; await refreshAll(); render(); }),
  tab: (e) => guard(async () => { S.tab = e.k; S.stack = []; S.sheet = null; render(); window.scrollTo && window.scrollTo(0, 0); await tabLoad(); }),
  back: () => { S.stack.pop(); render(); },
  drawer: () => { S.sheet = { k: 'drawer' }; render(); },
  sheet: (e) => guard(async () => {
    S.sheet = { k: e.k }; render();
    if (e.k === 'approver' || e.k === 'approverA') {
      const d = e.k === 'approver' ? S.draft : S.adraft;
      if (!d.approvers) { d.approvers = await rpc('my_approver_candidates', e.k === 'approver' ? { p_leave_type: d.typeId } : {}); render(); }
    }
  }),
  closeSheet,
  seg: (e) => { S.seg = e.k; render(); },
  mnav: (e) => guard(async () => {
    const key = e.k, n = +e.n;
    if (key === 'draft') { S.draft.cal = shiftMonth(S.draft.cal, n); render(); return; }
    S[key] = shiftMonth(S[key], n);
    const [a, b] = gridRange(S[key]); render(); await ensureRange(a, b); render();
  }),
  clock: () => guard(async () => {
    if (S.busy) return;
    const rec = S.recs[S.today], action = !rec ? 'in' : 'out';
    if (rec && rec.clockOut) return;
    const g = S.settings.geofence || {}, need = geoOn() && (action === 'in' ? g.apply_in !== false : g.apply_out !== false);
    S.sheet = null; S.busy = true; render();
    let pos = { lat: null, lng: null, accuracy: null };
    if (need) {
      toast('위치를 확인하는 중…');
      pos = await getPos();
      if (pos.error) { S.busy = false; S.toast = ''; S.sheet = { k: 'geoFail', action, res: { code: pos.error } }; render(); return; }
    }
    const res = await rpc(action === 'in' ? 'clock_in' : 'clock_out', { p_lat: pos.lat, p_lng: pos.lng, p_accuracy: pos.accuracy });
    S.busy = false; S.toast = '';
    if (!res.ok) { S.sheet = { k: 'geoFail', action, res: res.geo }; render(); return; }
    await loadRange(S.today, S.today); S.loaded = new Set(); render();
    toast(action === 'in' ? '출근했습니다.' : '퇴근했습니다.');
  }),
  leaveNew: () => guard(async () => {
    S.sheet = null; if (!S.bal) await loadLeave();
    const t = S.types.find((x) => x.deduct_from === 'annual') || S.types[0];
    S.draft = { typeId: t ? t.id : null, dates: [], cal: { ...S.cal }, reason: '', approverId: null, approvers: null };
    S.stack = [{ name: 'leave1' }]; render();
  }),
  setType: (e) => { S.draft.typeId = e.id; S.draft.dates = []; S.draft.approverId = null; S.draft.approvers = null; closeSheet(); },
  pickDate: (e) => {
    const d = S.draft, t = typeOf(d.typeId), i = d.dates.indexOf(e.d);
    if (i >= 0) d.dates.splice(i, 1);
    else if (t.max_days && d.dates.length >= t.max_days) return toast(`이 유형은 최대 ${t.max_days}일까지 선택할 수 있습니다.`);
    else d.dates.push(e.d);
    d.dates.sort(); render();
  },
  step2: () => push('leave2'),
  setApprover: (e) => { const d = e.w === 'approver' ? S.draft : S.adraft; d.approverId = e.id; closeSheet(); },
  send: () => guard(async () => {
    const d = S.draft; if (S.busy || !d.reason.trim() || !d.approverId) return;
    S.busy = true; render();
    await rpc('submit_leave_request', { p_type: d.typeId, p_dates: d.dates, p_reason: d.reason.trim(), p_approver: d.approverId });
    const to = person(d.approverId)?.name ?? ''; S.busy = false; S.draft = null; S.stack = []; S.tab = 'requests'; S.seg = 'mine';
    await refreshAll(); render(); toast(`요청을 보냈습니다. 승인권자: ${to}`);
  }),
  attNew: (e) => guard(async () => {
    S.sheet = null; const action = e.k || 'edit';
    let date = S.today;
    if (action === 'create') for (let d = addDays(S.today, -1), i = 0; i < 40; d = addDays(d, -1), i++) if (isWorkday(d) && !S.recs[d] && leaveMin(d, false) < 480) { date = d; break; }
    const cur = S.recs[date];
    S.adraft = { action, date, clockIn: cur ? cur.clockIn : '09:00', clockOut: cur && cur.clockOut ? cur.clockOut : '18:00', reason: '', approverId: null, approvers: null };
    S.stack = [{ name: 'att' }]; render();
  }),
  attFromGeo: (e) => {
    const rec = S.recs[S.today];
    S.adraft = { action: rec ? 'edit' : 'create', date: S.today, clockIn: rec ? rec.clockIn : '', clockOut: rec && rec.clockOut ? rec.clockOut : '', reason: '', approverId: null, approvers: null };
    const now = hmSeoul(new Date().toISOString());
    if (!rec && e.k === 'in') S.adraft.clockIn = now; if (rec && e.k === 'out') S.adraft.clockOut = now;
    S.stack = [{ name: 'att' }]; S.sheet = null; render();
  },
  attAction: (e) => { const d = S.adraft, cur = S.recs[d.date]; d.action = e.k; if (cur && e.k !== 'create') { d.clockIn = cur.clockIn; d.clockOut = cur.clockOut || d.clockOut; } render(); },
  sendAtt: () => guard(async () => {
    const d = S.adraft; if (S.busy || !attOk()) return;
    S.busy = true; render();
    await rpc('submit_attendance_request', { p_action: d.action, p_date: d.date, p_in: d.action === 'delete' ? null : d.clockIn, p_out: d.action === 'delete' ? null : d.clockOut, p_reason: d.reason.trim(), p_approver: d.approverId });
    const to = person(d.approverId)?.name ?? ''; S.busy = false; S.adraft = null; S.stack = []; S.tab = 'requests'; S.seg = 'mine';
    await refreshAll(); render(); toast(`요청을 보냈습니다. 승인권자: ${to}`);
  }),
  req: (e) => push('req', { id: e.id, kind: e.k }),
  decide: (e) => guard(async () => {
    S.busy = true; await rpc('decide_request', { p_kind: e.k, p_id: e.id, p_decision: e.v, p_comment: null });
    S.busy = false; S.stack = []; await refreshAll(); render(); toast(e.v === 'approved' ? '승인했습니다.' : '반려했습니다.');
  }),
  cancel: (e) => guard(async () => {
    await rpc('cancel_request', { p_kind: e.k, p_id: e.id });
    S.stack = []; await refreshAll(); render(); toast('요청을 취소했습니다.');
  }),
};
async function tabLoad() {
  if (S.tab === 'schedule') { const [a, b] = gridRange(S.cal); await ensureRange(a, b); }
  if (S.tab === 'records') { const [a, b] = gridRange(S.rec); await ensureRange(a, b); }
  if (S.tab === 'requests') await loadRequests();
  if (S.tab === 'leave') { await Promise.all([loadLeave(), loadRequests()]); }
  render();
}
const C = {
  ad: (el) => guard(async () => {
    const f = el.dataset.f; S.adraft[f] = el.value;
    if (f === 'date') {
      const d = S.adraft; await ensureRange(d.date, d.date);
      const cur = S.recs[d.date];
      if (d.action !== 'create') { d.clockIn = cur ? cur.clockIn : ''; d.clockOut = cur && cur.clockOut ? cur.clockOut : ''; }
    }
    render();
  }),
};
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a]')) return;
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('sheetbg') && e.target !== el) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest && e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el); });
document.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.i;
  if (i === 'reason') { S.draft.reason = e.target.value; const b = $('sendBtn'); if (b) b.disabled = !(S.draft.reason.trim() && S.draft.approverId) || S.busy; }
  if (i === 'areason') { S.adraft.reason = e.target.value; const b = $('sendBtnA'); if (b) b.disabled = !attOk() || S.busy; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && S.view === 'login' && e.target && (e.target.id === 'em' || e.target.id === 'pw')) A.login(); });

if (!CFG || !CFG.url || !CFG.key || /__SUPABASE/.test(CFG.url)) {
  $('app').innerHTML = '<div class="login"><h1>설정이 필요합니다</h1><div class="card">Supabase 주소와 공개용 키가 설정되지 않았습니다.</div></div>';
} else if (session) bootMain();
else { S.view = 'login'; render(); }
if (typeof window !== 'undefined') { window.__S = S; window.__A = A; window.__C = C; window.__render = render; }

</script>
</body>
</html>
