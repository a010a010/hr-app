<script>
/* 공개용 설정: Project URL과 publishable(anon) 키만 넣는다. secret/service_role 키와 DB 비밀번호는 절대 넣지 않는다. */
window.APP_CONFIG = { url: 'https://zqfvntplsqftbkfewqsk.supabase.co', key: 'sb_publishable_bXeTU9omjAxUzUijyNzEkg_JmrTo-8v' };

<script>
/* ---- dates.js ---- */
// 날짜는 모두 'YYYY-MM-DD' 문자열로 다루고, 내부 계산은 UTC로 해서 시간대 문제를 피한다.
const pad = (n) => String(n).padStart(2, '0');

function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function ymd(d) {
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}
function addDays(s, n) {
  const d = parseYMD(s);
  d.setUTCDate(d.getUTCDate() + n);
  return ymd(d);
}
// 말일 보정: 1/31 + 1개월 = 2/28(29)
function addMonths(s, n) {
  const d = parseYMD(s);
  const day = d.getUTCDate();
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return ymd(t);
}
function diffDays(a, b) {
  return Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
}
function dayOfWeek(s) {
  return parseYMD(s).getUTCDay(); // 0=일 ... 6=토
}
// b 시점에 a로부터 꽉 채운 연수
function fullYearsBetween(a, b) {
  const x = parseYMD(a), y = parseYMD(b);
  let years = y.getUTCFullYear() - x.getUTCFullYear();
  const before =
    y.getUTCMonth() < x.getUTCMonth() ||
    (y.getUTCMonth() === x.getUTCMonth() && y.getUTCDate() < x.getUTCDate());
  if (before) years -= 1;
  return years;
}
function daysInMonth(year, month) {
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

/* ---- attendance.js ---- */

// 관리자 설정값(policies 테이블)과 1:1로 대응한다.
const DEFAULT_POLICY = {
  breakMinutes: 60,          // 하루 고정 휴게 공제 (체류시간과 무관)
  leaveHoursPerDay: 8,       // 연차 1일 = 8시간으로 환산 (반차는 절반)
  weeklyHolidayDow: [0],     // 휴일근로로 분리 집계할 요일 (0=일요일)
};

function toMinutes(hm) {
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}

// 하루 실근로(분) = 체류시간 - 고정 휴게. 퇴근이 출근보다 이르면 익일 퇴근으로 본다.
function dailyWorkMinutes(record, policy = DEFAULT_POLICY) {
  if (!record || !record.clockIn || !record.clockOut) return 0;
  let stay = toMinutes(record.clockOut) - toMinutes(record.clockIn);
  if (stay < 0) stay += 24 * 60;
  return Math.max(0, stay - policy.breakMinutes);
}

function fmtMinutes(min) {
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

/**
 * 월 근태 집계
 * @param records  [{date, clockIn:'09:00', clockOut:'18:00'}]
 * @param leaves   승인된 휴가를 일 단위로 펼친 것 [{date, minutes}] — minutes는 휴가 유형의 '유급 인정 시간'.
 *                 minutes가 없으면 {date, days}를 days × leaveHoursPerDay로 환산(하위 호환).
 * @param holidays 공휴일 ['YYYY-MM-DD']
 * 규칙: 휴가는 근무일에만 환산, 휴일(일요일·공휴일) 근무는 평일 합계와 분리 집계.
 */
function summarizeMonth({ year, month, records, leaves = [], holidays = [], policy = DEFAULT_POLICY }) {
  const recByDate = new Map(records.map((r) => [r.date, r]));
  const leaveByDate = new Map(); // date → 인정 분
  for (const l of leaves) {
    const minutes = l.minutes ?? (l.days ?? 0) * policy.leaveHoursPerDay * 60;
    leaveByDate.set(l.date, (leaveByDate.get(l.date) ?? 0) + minutes);
  }
  const holidaySet = new Set(holidays);

  let workMinutes = 0, leaveMinutes = 0, holidayWorkMinutes = 0, workDays = 0;
  const details = [];

  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isHoliday = policy.weeklyHolidayDow.includes(dayOfWeek(date)) || holidaySet.has(date);
    const work = dailyWorkMinutes(recByDate.get(date), policy);

    if (isHoliday) {
      holidayWorkMinutes += work;
      if (work > 0) details.push({ date, kind: 'holiday', workMinutes: work, leaveMinutes: 0 });
      continue;
    }
    const leave = leaveByDate.get(date) ?? 0;
    workMinutes += work;
    leaveMinutes += leave;
    if (work > 0) workDays += 1;
    if (work > 0 || leave > 0) details.push({ date, kind: 'weekday', workMinutes: work, leaveMinutes: leave });
  }

  return {
    workMinutes,
    leaveMinutes,
    weekdayMinutes: workMinutes + leaveMinutes, // 평일 합계 = 실근로 + 휴가 환산
    holidayWorkMinutes,                          // 휴일근로는 별도
    workDays,
    details,
  };
}

/**
 * 월 소정근로시간(분) = (휴일이 아닌 날 수) × 하루 소정시간
 * 휴일 = weeklyHolidayDow(일요일) + 공휴일·대체공휴일. 토요일은 휴일로 보지 않지만
 * 이 회사처럼 주 5일제이면 weeklyHolidayDow에 6(토)을 포함해 설정한다.
 * @param dailyMinutes 하루 소정근로시간(분), 기본 8시간
 * @param offDow       소정근로일에서 제외할 요일 (기본: 토·일)
 */
function scheduledMinutes({ year, month, holidays = [], dailyMinutes = 480, offDow = [0, 6] }) {
  const holidaySet = new Set(holidays);
  let days = 0;
  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (offDow.includes(dayOfWeek(date)) || holidaySet.has(date)) continue;
    days += 1;
  }
  return { days, minutes: days * dailyMinutes };
}

/* ---- leave.js ---- */

const DEFAULT_LEAVE_POLICY = {
  basis: 'hire_date',          // 'hire_date'(입사일) | 'fiscal_year'(회계연도)
  fiscalYearStartMonth: 1,     // 회계연도 시작 월
  prorateRounding: 'ceil',     // 비례 연차 0.5일 단위 처리: ceil | round | floor
};

function roundHalf(x, mode) {
  const v = x * 2;
  const r = mode === 'floor' ? Math.floor(v) : mode === 'round' ? Math.round(v) : Math.ceil(v);
  return r / 2;
}
// 근로기준법 제60조: 1년 이상 15일, 3년차부터 2년마다 1일 가산, 최대 25일
function annualDaysForServiceYear(n) {
  return Math.min(25, 15 + Math.floor((n - 1) / 2));
}
const expiry = (date) => addDays(addMonths(date, 12), -1);

/**
 * 연차 발생 내역 생성 (출근율 80% 이상/월 개근을 가정. 미충족은 관리자가 수동 조정)
 * 반환: [{date, days, kind: 'monthly'|'annual'|'prorated', expires}]
 */
function generateGrants(hireDate, asOf, policy = DEFAULT_LEAVE_POLICY) {
  return policy.basis === 'fiscal_year'
    ? grantsFiscal(hireDate, asOf, policy)
    : grantsHireDate(hireDate, asOf);
}

function grantsHireDate(hire, asOf) {
  const grants = [];
  const oneYear = addMonths(hire, 12);
  for (let k = 1; k <= 11; k++) {
    const date = addMonths(hire, k);
    if (date >= oneYear || date > asOf) break;
    grants.push({ date, days: 1, kind: 'monthly', expires: expiry(date) });
  }
  for (let n = 1; ; n++) {
    const date = addMonths(hire, 12 * n);
    if (date > asOf) break;
    grants.push({ date, days: annualDaysForServiceYear(n), kind: 'annual', expires: expiry(date) });
  }
  return grants;
}

function grantsFiscal(hire, asOf, policy) {
  const grants = [];
  const m = String(policy.fiscalYearStartMonth).padStart(2, '0');
  const hireYear = Number(hire.slice(0, 4));
  let firstStart = `${hireYear}-${m}-01`;
  if (firstStart <= hire) firstStart = `${hireYear + 1}-${m}-01`;

  // 입사 첫 회계연도: 만 1개월 개근마다 1일 (최대 11일)
  for (let k = 1; k <= 11; k++) {
    const date = addMonths(hire, k);
    if (date >= firstStart || date > asOf) break;
    grants.push({ date, days: 1, kind: 'monthly', expires: expiry(date) });
  }
  // 첫 회계연도 시작일: 입사일~회계연도 말 재직일수 비례 (15일 상한)
  if (firstStart <= asOf) {
    const prorated = Math.min(15, roundHalf((15 * diffDays(hire, firstStart)) / 365, policy.prorateRounding));
    grants.push({ date: firstStart, days: prorated, kind: 'prorated', expires: expiry(firstStart) });
  }
  // 이후 회계연도 시작일: 시작일 시점 만 근속연수 기준
  for (let i = 1; ; i++) {
    const date = `${Number(firstStart.slice(0, 4)) + i}-${m}-01`;
    if (date > asOf) break;
    const years = Math.max(1, fullYearsBetween(hire, date));
    grants.push({ date, days: annualDaysForServiceYear(years), kind: 'annual', expires: expiry(date) });
  }
  return grants;
}

/**
 * 잔여 연차 계산: 사용분은 사용일에 유효한 발생분 중 소멸일이 빠른 것부터 차감(FIFO).
 * @param grants [{date, days, expires}]  (수동 조정 포함)
 * @param used   [{date, days}]           승인된 사용 내역
 */
function leaveBalance({ grants, used, asOf }) {
  const pool = grants
    .filter((g) => g.date <= asOf)
    .map((g) => ({ ...g, remaining: g.days }))
    .sort((a, b) => a.expires.localeCompare(b.expires));
  let shortage = 0;
  const usedSoFar = used.filter((x) => x.date <= asOf).sort((a, b) => a.date.localeCompare(b.date));
  for (const u of usedSoFar) {
    let need = u.days;
    for (const g of pool) {
      if (need <= 0) break;
      if (g.date <= u.date && u.date <= g.expires && g.remaining > 0) {
        const take = Math.min(g.remaining, need);
        g.remaining -= take;
        need -= take;
      }
    }
    shortage += need; // 발생분 부족(마이너스 연차)
  }
  const available = pool.filter((g) => g.expires >= asOf).reduce((s, g) => s + g.remaining, 0);
  const granted = grants.filter((g) => g.date <= asOf).reduce((s, g) => s + g.days, 0);
  const usedTotal = usedSoFar.reduce((s, x) => s + x.days, 0);
  return { granted, used: usedTotal, remaining: available - shortage, shortage };
}

/**
 * 퇴직 시 연차 재정산 (회사가 회계연도 기준으로 부여한 경우: "퇴직 시에는 입사일 기준으로 재정산").
 * 입사일 기준으로 퇴직일까지 발생했어야 할 연차 총량과, 회계연도 기준으로 실제 부여한 총량을 비교한다.
 *  - extraDays > 0 : 입사일 기준이 더 많음 → 회사가 추가로 인정해야 할 일수
 *  - extraDays < 0 : 회계연도 기준으로 더 많이 부여함 → 초과 부여분(회수 여부는 회사 규정·노무 검토 사항)
 *  - unusedHireBasis: 입사일 기준 총량에서 사용한 일수를 뺀 값 (연차수당 정산 대상 일수의 기준)
 * 주의: 계산 보조 도구이며, 연차수당 지급 여부·금액은 인사 담당자·노무사가 확정해야 한다.
 */
function retirementSettlement({ hireDate, retireDate, usedDays, leavePolicy = DEFAULT_LEAVE_POLICY }) {
  const sum = (gs) => gs.reduce((s, g) => s + g.days, 0);
  const hireBasis = sum(generateGrants(hireDate, retireDate, { ...leavePolicy, basis: 'hire_date' }));
  const fiscalBasis = sum(generateGrants(hireDate, retireDate, { ...leavePolicy, basis: 'fiscal_year' }));
  return {
    hireBasisTotal: hireBasis,
    fiscalBasisTotal: fiscalBasis,
    extraDays: hireBasis - fiscalBasis,
    unusedHireBasis: hireBasis - usedDays,
    unusedFiscalBasis: fiscalBasis - usedDays,
  };
}

}

async function loadRange(from, to) {
  const uid = session.user.id;
  const [recs, lds, shs] = await Promise.all([
    rest('attendance_records', `select=work_date,clock_in,clock_out,source,in_distance_m,out_distance_m&user_id=eq.${uid}&work_date=gte.${from}&work_date=lte.${to}`),
    rest('leave_days', `select=leave_date,minutes,deduct_days,type_id,request_id,leave_requests(status)&user_id=eq.${uid}&active=eq.true&leave_date=gte.${from}&leave_date=lte.${to}`),
    rest('work_schedules', `select=work_date,start_time,end_time&user_id=eq.${uid}&work_date=gte.${from}&work_date=lte.${to}`),
  ]);
  for (let d = from; d <= to; d = addDays(d, 1)) { delete S.recs[d]; delete S.lv[d]; delete S.sched[d]; }
  for (const x of shs) S.sched[x.work_date] = { start: x.start_time.slice(0, 5), end: x.end_time.slice(0, 5) };
  for (const r of recs) S.recs[r.work_date] = { date: r.work_date, clockIn: hmSeoul(r.clock_in), clockOut: hmSeoul(r.clock_out), source: r.source, inDist: r.in_distance_m, outDist: r.out_distance_m };
  for (const l of lds) (S.lv[l.leave_date] = S.lv[l.leave_date] || []).push({ minutes: l.minutes, deduct: l.deduct_days, typeId: l.type_id, reqId: l.request_id, status: l.leave_requests ? l.leave_requests.status : 'pending' });
  S.loaded.add(`${from}|${to}`);
}
async function ensureRange(from, to) { if (!S.loaded.has(`${from}|${to}`)) await loadRange(from, to); }
const gridRange = (c) => { const first = `${c.y}-${p2(c.m)}-01`, last = `${c.y}-${p2(c.m)}-${p2(daysInMonth(c.y, c.m))}`; return [weekStartOf(first), addDays(weekStartOf(last), 6)]; };

const minHM = (m) => `${p2(Math.floor(m / 60))}:${p2(m % 60)}`;
function planDay(d) {
  const sc = S.sched[d], lv = leaveMin(d), full = S.policy.leaveHoursPerDay * 60;
  const work = sc ? Math.max(0, toMinutes(sc.end) - toMinutes(sc.start) - S.policy.breakMinutes) : 0;
  return lv >= full ? lv : lv + Math.min(work, full - lv);
}
function clockHint() {
  const rules = S.settings.clock_rules || {};
  if (rules.require_schedule === false) return null;
  const sc = S.sched[S.today];
  if (!sc) return { code: 'no_schedule', text: '오늘 승인된 근무일정이 없어 출근할 수 없습니다. 근무일정을 요청해 승인받으세요.' };
  const before = rules.before_start_minutes ?? 30, st = toMinutes(sc.start);
  const open = minHM(st > before ? st - before : 0), now = hmSeoul(new Date().toISOString());
  if (now < open) return { code: 'too_early', text: `${open}부터 출근할 수 있습니다. (일정 ${sc.start}-${sc.end})` };
  if (now > sc.end) return { code: 'ended', text: `오늘 일정(${sc.start}-${sc.end})이 끝났습니다.` };
  return { code: 'open', text: `일정 ${sc.start}-${sc.end} · ${open}부터 출근 가능` };
}

function geoMessage(res) {

  if (g.code === 'low_accuracy') return `위치 정확도가 낮습니다 (오차 ${g.accuracy}m). 실외나 창가에서 다시 시도해 주세요.`;
  if (g.code === 'no_site') return '등록된 근무지가 없습니다. 관리자에게 문의해 주세요.';
  if (g.code === 'denied') return '위치 권한이 거부되어 있습니다. 브라우저 설정에서 이 사이트의 위치를 허용해 주세요.';
  if (g.code === 'unavailable') return '현재 위치를 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if (g.code === 'unsupported') return '이 기기에서는 위치 확인을 지원하지 않습니다.';

}

let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 3200); }
const push = (name, extra = {}) => { S.stack.push({ name, ...extra }); S.sheet = null; render(); window.scrollTo && window.scrollTo(0, 0); };

async function guard(fn) {
  try { return await fn(); }
  catch (e) {
    if (e instanceof ApiError && e.status === 401) { await doLogout(true); return undefined; }
    if (e instanceof TypeError) e.status = 0;
    S.busy = false; toast(errText(e)); return undefined;
  }
}
const getPos = () => new Promise((resolve) => {
  if (typeof navigator === 'undefined' || !navigator.geolocation) return resolve({ error: 'unsupported' });
  navigator.geolocation.getCurrentPosition((q) => resolve({ lat: q.coords.latitude, lng: q.coords.longitude, accuracy: q.coords.accuracy }),
    (e) => resolve({ error: e.code === 1 ? 'denied' : 'unavailable' }), { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
});

}

}

/* ----- 조직 ----- */
function descendants(id) { const out = new Set(); const walk = (pid) => { for (const o of S.orgs) if (o.parent_id === pid && !out.has(o.id)) { out.add(o.id); walk(o.id); } }; walk(id); return out; }
function orgRows() {
  const kids = (pid) => S.orgs.filter((o) => (o.parent_id ?? null) === pid).sort((a, b) => (a.sort - b.sort) || a.name.localeCompare(b.name));
  const out = []; const walk = (pid, depth) => { for (const o of kids(pid)) { out.push({ o, depth }); walk(o.id, depth + 1); } }; walk(null, 0); return out;
}
function adminOrgsPage() {
  const people = S.adm.people || [];
  return { header: header({ back: true, title: '조직 관리', right: '<button class="btn" style="border:0;color:var(--primary);height:44px" data-a="adminOrgNew">+ 추가</button>' }), cls: 'narrow', body: `<div class="card flush">${orgRows().map(({ o, depth }) => {
    const head = people.find((p) => p.id === o.head_id), n = people.filter((p) => p.org_id === o.id).length;
    return `<button class="rowbtn" style="font-weight:500;border-top:1px solid var(--line);padding-left:${16 + depth * 20}px" data-a="adminOrg" data-id="${o.id}"><div><div>${esc(o.name)}</div><div class="muted small">${esc(o.head_title)}: ${head ? esc(head.name) : '공석'} · ${n}명</div></div><span class="chev">${ico('chev')}</span></button>`;
  }).join('') || '<div class="empty">조직이 없습니다.</div>'}</div>
    <div class="demo">조직장은 승인권자 후보의 기준이 됩니다. 팀원의 후보는 소속 조직장 → 상위 조직장 순으로 나옵니다.</div>` };
}

async function buildReport() {
  const r = S.adm.rep, from = `${r.y}-${p2(r.m)}-01`, to = `${r.y}-${p2(r.m)}-${p2(daysInMonth(r.y, r.m))}`;
  const [people, recs, lds] = await Promise.all([
    restAll('profiles', 'select=id,name,org_id,status,hire_date&order=name'),
    restAll('attendance_records', `select=user_id,work_date,clock_in,clock_out&work_date=gte.${from}&work_date=lte.${to}`),
    restAll('leave_days', `select=user_id,leave_date,minutes,leave_requests(status)&active=eq.true&leave_date=gte.${from}&leave_date=lte.${to}`),
  ]);
  const hol = Object.keys(S.holidays), byU = (arr, k) => { const m = {}; for (const x of arr) (m[x[k]] = m[x[k]] || []).push(x); return m; };
  const ru = byU(recs, 'user_id'), lu = byU(lds, 'user_id');
  const sch = scheduledMinutes({ year: r.y, month: r.m, holidays: hol, dailyMinutes: S.policy.leaveHoursPerDay * 60 });
  r.rows = people.filter((p) => p.status !== 'resigned' || (ru[p.id] || []).length).map((p) => {
    const records = (ru[p.id] || []).filter((x) => x.clock_out).map((x) => ({ date: x.work_date, clockIn: hmSeoul(x.clock_in), clockOut: hmSeoul(x.clock_out) }));
    const leaves = (lu[p.id] || []).filter((x) => x.leave_requests && x.leave_requests.status === 'approved').map((x) => ({ date: x.leave_date, minutes: x.minutes }));
    const s2 = summarizeMonth({ year: r.y, month: r.m, records, leaves, holidays: hol, policy: S.policy });
    return { id: p.id, name: p.name, org: orgName(p.org_id), days: s2.workDays, work: s2.workMinutes, leave: s2.leaveMinutes, weekday: s2.weekdayMinutes, holiday: s2.holidayWorkMinutes, scheduled: sch.minutes };
  });
}
const h2 = (min) => (Math.round((min / 60) * 100) / 100).toFixed(2);
function reportCsv() {
  const r = S.adm.rep, head = ['이름', '소속', '근무일수', '실근로(시간)', '휴가 환산(시간)', '평일 합계(시간)', '휴일근로(시간)', '월 소정(시간)', '평일 합계-소정(시간)'];
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  return [head, ...(r.rows || []).map((x) => [x.name, x.org, x.days, h2(x.work), h2(x.leave), h2(x.weekday), h2(x.holiday), h2(x.scheduled), h2(x.weekday - x.scheduled)])].map((row) => row.map(q).join(',')).join('\r\n');
}

  adminSiteNew: () => push('adminSite', { id: null }),
  adminSite: (e) => push('adminSite', { id: e.id }),
  siteHere: () => guard(async () => { const q = await getPos(); if (q.error) return toast(geoMessage({ code: q.error })); $('st-lat').value = +q.lat.toFixed(6); $('st-lng').value = +q.lng.toFixed(6); toast('현재 위치를 입력했습니다. 저장을 눌러 주세요.'); }),
  saveSite: () => guard(async () => {
    need(); const top = S.stack[S.stack.length - 1], lat = Number(val('st-lat')), lng = Number(val('st-lng')), name = val('st-name').trim();
    if (!name) return toast('이름을 입력해 주세요.'); if (!(lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180)) return toast('위도·경도를 확인해 주세요.');
    const body = { name, lat, lng, radius_m: numOrNull(val('st-rad')), active: isOn('st-act') };
    if (top.id) await send('PATCH', 'geo_sites', `id=eq.${top.id}`, body); else await send('POST', 'geo_sites', '', [body]);
    await ADM_LOAD.adminGeo(); S.stack.pop(); render(); toast('저장했습니다.');
  }),
  delSite: (e) => guard(async () => { need(); await send('DELETE', 'geo_sites', `id=eq.${e.id}`); await ADM_LOAD.adminGeo(); S.stack.pop(); render(); toast('삭제했습니다.'); }),
  exemptToggle: (e, ev) => guard(async () => {
    need(); const on = !!(ev && ev.target && ev.target.checked);
    if (on) await send('POST', 'geo_exempt', 'on_conflict=user_id', [{ user_id: e.id }], 'resolution=ignore-duplicates'); else await send('DELETE', 'geo_exempt', `user_id=eq.${e.id}`);
    if (on) S.adm.exempt.add(e.id); else S.adm.exempt.delete(e.id);
  }),

  repNav: (e) => guard(async () => { need(); S.adm.rep = { ...shiftMonth(S.adm.rep, +e.n) }; render(); await buildReport(); render(); }),
  repCsv: () => {
    const csv = `\uFEFF${reportCsv()}`, r = S.adm.rep;
    if (typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) return toast('이 기기에서는 파일 내려받기를 지원하지 않습니다.');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `근태집계_${r.y}-${p2(r.m)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },

  changePw: () => guard(async () => {
    const a = val('pw-new'), b = val('pw-new2'); if (a.length < 8) return toast('비밀번호는 8자 이상이어야 합니다.'); if (a !== b) return toast('비밀번호 확인이 일치하지 않습니다.');
    try { await api('PUT', '/auth/v1/user', { password: a }); S.stack.pop(); render(); toast('비밀번호를 변경했습니다.'); }
    catch (e) { if (e instanceof ApiError && e.status === 401) throw e; toast(/different from the old|same/i.test(e.message || '') ? '이전과 다른 비밀번호를 입력해 주세요.' : /password/i.test(e.message || '') ? '비밀번호 규칙에 맞지 않습니다. 더 길고 복잡하게 만들어 주세요.' : errText(e)); }
  }),
});

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a]')) return;
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('sheetbg') && e.target !== el) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest && e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el); });
document.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.i;
  if (i === 'reason') { S.draft.reason = e.target.value; const b = $('sendBtn'); if (b) b.disabled = !(S.draft.reason.trim() && S.draft.approverId) || S.busy; }
  if (i === 'sreason') { S.sdraft.reason = e.target.value; const b = $('sendBtnS'); if (b) b.disabled = !(Object.keys(S.sdraft.items).length && S.sdraft.reason.trim() && S.sdraft.approverId) || S.busy; }
  if (i === 'areason') { S.adraft.reason = e.target.value; const b = $('sendBtnA'); if (b) b.disabled = !attOk() || S.busy; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && S.view === 'login' && e.target && (e.target.id === 'em' || e.target.id === 'pw' || e.target.id === 'pw2')) (S.authMode === 'signup' ? A.signup() : A.login()); });

if (!CFG || !CFG.url || !CFG.key || /__SUPABASE/.test(CFG.url)) {
  $('app').innerHTML = '<div class="login"><h1>설정이 필요합니다</h1><div class="card">Supabase 주소와 공개용 키가 설정되지 않았습니다.</div></div>';
} else if (session) bootMain();
else { S.view = 'login'; render(); }
if (typeof window !== 'undefined') { window.__S = S; window.__A = A; window.__C = C; window.__render = render; }

</script>
</body>
</html>
